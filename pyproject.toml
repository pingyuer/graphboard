[project]
name = "graphboard"
version = "0.2.2"
description = "Graph-based task automaton for multi-agent research workflows"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "mcp>=2"]

[project.scripts]
gb = "graphboard.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["graphboard*"]

[tool.setuptools.package-data]
graphboard = ["templates/*", "templates/**/*"]
